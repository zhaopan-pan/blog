server {
    listen 8080;
    server_name _;
    root /srv/blog;
    index index.html;
    absolute_redirect off;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
